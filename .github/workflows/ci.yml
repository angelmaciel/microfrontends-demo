name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks lee los commits del pull request.
  pull-requests: read

jobs:
  calidad:
    name: Lint, tipos, formato, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:cov
      - run: npm run build

  e2e:
    name: E2E del sistema compuesto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Solo Chromium y sus dependencias del sistema: es lo que usan los dos proyectos.
      - run: npx playwright install --with-deps chromium
      # Compila las cuatro apps, las levanta con `vite preview` y corre Playwright.
      - run: npm run e2e
      # Si algo falla, el reporte HTML (con capturas y traces) queda descargable desde el run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7

  seguridad:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit --audit-level=moderate
